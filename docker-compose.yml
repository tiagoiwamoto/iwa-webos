services:
  webos:
    build: .
    container_name: linux-webos
    privileged: true            # required for systemd as PID 1
    stop_signal: SIGRTMIN+3     # systemd's shutdown signal
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "${WEBOS_PORT:-8000}:${WEBOS_PORT:-8000}"
    environment:
      # auth mode: 'pam' = real Linux users; anything else = dev null adapter
      WEBOS_PORT: ${WEBOS_PORT:-8000}
      WEBOS_AUTH: pam
      # only members of this unix group may log in (empty = any valid user)
      WEBOS_REQUIRED_GROUPS: webos
      # WEBOS_DENY_USERS: root
      # real home dirs instead of web/vfs/<user>
      WEBOS_VFS_ROOT: /home
      # demo user created on boot (change the password!)
      WEBOS_USER: webos
      WEBOS_PASSWORD: webos
      # server app store index (CasaOS-compatible format)
      # WEBOS_STORE_URL: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages
      # WEBOS_TOKEN: set to pin a fixed agent token (random per boot otherwise)
    volumes:
      # lets the Docker app / app store manage the HOST's containers —
      # full host root equivalent; remove if you don't need it
      - /var/run/docker.sock:/var/run/docker.sock
      - webos-apps:/srv/webos-apps

  # DbGate — unified database manager (PostgreSQL, MariaDB, MongoDB,
  # Redis, SQLite, MSSQL…) embedded in the Databases app via iframe.
  # NOT published on the host: reachable only through the authenticated
  # OS.js proxy at /dbgate/, so the OS login is the only login needed.
  dbgate:
    image: dbgate/dbgate
    container_name: webos-dbgate
    restart: unless-stopped
    volumes:
      - dbgate-data:/root/.dbgate
    environment:
      WEB_ROOT: /dbgate
      # auth is enforced by the webos-web proxy (OS.js session)
      SKIP_ALL_AUTH: "1"
      # preconfigured connections — 'webos' resolves to the webos
      # service container on the compose network
      CONNECTIONS: postgres,mariadb
      LABEL_postgres: PostgreSQL
      SERVER_postgres: webos
      PORT_postgres: 5432
      USER_postgres: postgres
      PASSWORD_postgres: ${WEBOS_PASSWORD:-webos}
      ENGINE_postgres: postgres@dbgate-plugin-postgres
      LABEL_mariadb: MariaDB
      SERVER_mariadb: webos
      PORT_mariadb: 3306
      USER_mariadb: webos
      PASSWORD_mariadb: ${WEBOS_PASSWORD:-webos}
      ENGINE_mariadb: mysql@dbgate-plugin-mysql

volumes:
  webos-apps:
  dbgate-data:

  <!-- tongue out -->
  <rect x="56" y="80" width="16" height="28" rx="8" fill="#f4879b"/>
  <line x1="64" y1="85" x2="64" y2="102" stroke="#d9607a" stroke-width="2.5"
        stroke-linecap="round"/>

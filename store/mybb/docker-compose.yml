services:
  mybb:
    build: .
    restart: unless-stopped
    ports:
      - "8102:80"
    environment:
      APP_URL: https://github.com/mybb/mybb/releases/download/mybb_1841/mybb_1841.zip
      APP_SUBDIR: Upload
    volumes:
      - data:/var/www/html
    depends_on:
      - db
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: webos-root
      MYSQL_DATABASE: mybb
      MYSQL_USER: mybb
      MYSQL_PASSWORD: mybb
    volumes:
      - db:/var/lib/mysql
volumes:
  data:
  db:

services:
  mediawiki:
    image: mediawiki:latest
    restart: unless-stopped
    ports:
      - "8108:80"
    volumes:
      - data:/var/www/html
    depends_on:
      - db
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: webos-root
      MYSQL_DATABASE: mediawiki
      MYSQL_USER: mediawiki
      MYSQL_PASSWORD: mediawiki
    volumes:
      - db:/var/lib/mysql
volumes:
  data:
  db:

services:
  flarum:
    image: mondedie/flarum:latest
    restart: unless-stopped
    ports:
      - "8112:8888"
    environment:
      FORUM_URL: http://localhost:8112
      DB_HOST: db
      DB_NAME: flarum
      DB_USER: flarum
      DB_PASS: flarum
      FLARUM_ADMIN_USER: admin
      FLARUM_ADMIN_PASS: webos-admin
      FLARUM_TITLE: Flarum
      FLARUM_DESCRIPTION: WebOS forum
    volumes:
      - data:/flarum/app/extensions
      - assets:/flarum/app/public/assets
    depends_on:
      - db
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: webos-root
      MYSQL_DATABASE: flarum
      MYSQL_USER: flarum
      MYSQL_PASSWORD: flarum
    volumes:
      - db:/var/lib/mysql
volumes:
  data:
  assets:
  db:
